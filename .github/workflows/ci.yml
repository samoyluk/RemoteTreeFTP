name: Tests and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python tools/test.py
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteTreeFTP
          path: build/RemoteTreeFTP.sublime-package
